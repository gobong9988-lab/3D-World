<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>O'Neill Cylinder — Pure WebGL2 Cinematic</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: #060a14;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
    }
    canvas { display: block; width: 100%; height: 100%; cursor: grab; }
    canvas:active { cursor: grabbing; }
    #hud {
      position: fixed; top: 16px; left: 16px;
      padding: 12px 16px;
      background: rgba(10, 18, 32, 0.62);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 10px;
      color: #f0f6ff; font-size: 13px; line-height: 1.55;
      pointer-events: none; transition: opacity 0.25s ease; z-index: 10;
    }
    #hud.hidden { opacity: 0; }
    #hud .title { font-weight: 700; font-size: 14px; letter-spacing: 0.03em; margin-bottom: 4px; color: #fff; }
    #hud .mode-badge {
      display: inline-block; padding: 2px 8px; border-radius: 999px;
      font-size: 11px; font-weight: 600; letter-spacing: 0.04em; margin-bottom: 6px;
      background: rgba(86, 188, 255, 0.25); border: 1px solid rgba(130, 210, 255, 0.5); color: #bfe8ff;
    }
    #hud .mode-badge.free {
      background: rgba(94, 234, 154, 0.22); border-color: rgba(120, 245, 175, 0.5); color: #c5ffe0;
    }
    #hud .controls { color: rgba(230, 242, 255, 0.85); font-size: 12px; }
    #hud kbd {
      display: inline-block; padding: 1px 5px; border-radius: 4px;
      background: rgba(255, 255, 255, 0.14); border: 1px solid rgba(255, 255, 255, 0.22);
      font-family: inherit; font-size: 11px; color: #fff;
    }
    #fps { margin-top: 4px; font-size: 11px; color: rgba(200, 225, 255, 0.72); font-variant-numeric: tabular-nums; }
    #fade-overlay {
      position: fixed; inset: 0; background: #04070f;
      opacity: 0; pointer-events: none; z-index: 5;
    }
    #error-box {
      display: none; position: fixed; inset: 0;
      background: #111827; color: #f87171; padding: 32px; font-size: 16px; z-index: 100;
    }
  </style>
</head>
<body>
  <canvas id="glcanvas"></canvas>
  <div id="fade-overlay"></div>
  <div id="hud">
    <div class="title">O'NEILL CYLINDER — PCF SHADOW + HDR BLOOM</div>
    <div>
      <span id="mode-badge" class="mode-badge">CINEMATIC AUTO-DRIVE</span>
      <span id="time-badge" class="mode-badge">AUTO CYCLE</span>
    </div>
    <div class="controls">
      <div><kbd>C</kbd> 시네마틱 / 자유 탐색 전환</div>
      <div id="free-controls" style="display:none;">
        <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 이동 · 마우스 드래그 시점 회전 · <kbd>Space</kbd>/<kbd>Shift</kbd> 상하
      </div>
      <div><kbd>1</kbd> 낮 · <kbd>2</kbd> 밤 · <kbd>3</kbd> 자동 시간 흐름</div>
      <div><kbd>R</kbd> 90초 시네마틱 영상 녹화 (.webm)</div>
      <div><kbd>H</kbd> HUD 숨기기 (클린 모드)</div>
    </div>
    <div id="fps">FPS: --</div>
  </div>
  <div id="error-box"></div>

  <script>
    (() => {
      'use strict';

      const canvas = document.getElementById('glcanvas');
      const hudEl = document.getElementById('hud');
      const modeBadgeEl = document.getElementById('mode-badge');
      const timeBadgeEl = document.getElementById('time-badge');
      const freeControlsEl = document.getElementById('free-controls');
      const fadeOverlayEl = document.getElementById('fade-overlay');
      const fpsEl = document.getElementById('fps');
      const errorBox = document.getElementById('error-box');

      function showError(msg) {
        errorBox.style.display = 'block';
        errorBox.textContent = 'WebGL2 Error: ' + msg;
        console.error(msg);
      }

      const gl = canvas.getContext('webgl2', {
        antialias: false, // Post-processing FBO handles final image
        alpha: false,
        powerPreference: 'high-performance'
      });
      if (!gl) {
        showError('이 브라우저는 WebGL2를 지원하지 않습니다.');
        return;
      }

      const hasFloatFBO = !!gl.getExtension('EXT_color_buffer_float');
      const RADIUS = 100.0;
      const LENGTH = 800.0;
      const HALF_LENGTH = LENGTH * 0.5;
      const SHADOW_RES = 2048;

      // =========================================================================
      // Matrix & Vector Math
      // =========================================================================
      function mat4Perspective(out, fovy, aspect, near, far) {
        const f = 1.0 / Math.tan(fovy * 0.5);
        const nf = 1.0 / (near - far);
        out[0] = f / aspect; out[1] = 0; out[2] = 0; out[3] = 0;
        out[4] = 0; out[5] = f; out[6] = 0; out[7] = 0;
        out[8] = 0; out[9] = 0; out[10] = (far + near) * nf; out[11] = -1;
        out[12] = 0; out[13] = 0; out[14] = 2 * far * near * nf; out[15] = 0;
        return out;
      }

      function mat4Ortho(out, l, r, b, t, n, f) {
        const lr = 1 / (l - r), bt = 1 / (b - t), nf = 1 / (n - f);
        out[0] = -2 * lr; out[1] = 0; out[2] = 0; out[3] = 0;
        out[4] = 0; out[5] = -2 * bt; out[6] = 0; out[7] = 0;
        out[8] = 0; out[9] = 0; out[10] = 2 * nf; out[11] = 0;
        out[12] = (l + r) * lr; out[13] = (t + b) * bt; out[14] = (f + n) * nf; out[15] = 1;
        return out;
      }

      function mat4LookAt(out, eye, center, up) {
        let zx = eye[0] - center[0], zy = eye[1] - center[1], zz = eye[2] - center[2];
        let len = Math.hypot(zx, zy, zz) || 1;
        zx /= len; zy /= len; zz /= len;
        let xx = up[1] * zz - up[2] * zy, xy = up[2] * zx - up[0] * zz, xz = up[0] * zy - up[1] * zx;
        len = Math.hypot(xx, xy, xz) || 1;
        xx /= len; xy /= len; xz /= len;
        const yx = zy * xz - zz * xy, yy = zz * xx - zx * xz, yz = zx * xy - zy * xx;
        out[0] = xx; out[1] = yx; out[2] = zx; out[3] = 0;
        out[4] = xy; out[5] = yy; out[6] = zy; out[7] = 0;
        out[8] = xz; out[9] = yz; out[10] = zz; out[11] = 0;
        out[12] = -(xx * eye[0] + xy * eye[1] + xz * eye[2]);
        out[13] = -(yx * eye[0] + yy * eye[1] + yz * eye[2]);
        out[14] = -(zx * eye[0] + zy * eye[1] + zz * eye[2]);
        out[15] = 1;
        return out;
      }

      function mat4Mul(out, a, b) {
        for (let c = 0; c < 4; c++) {
          const b0 = b[c * 4], b1 = b[c * 4 + 1], b2 = b[c * 4 + 2], b3 = b[c * 4 + 3];
          out[c * 4]     = a[0] * b0 + a[4] * b1 + a[8]  * b2 + a[12] * b3;
          out[c * 4 + 1] = a[1] * b0 + a[5] * b1 + a[9]  * b2 + a[13] * b3;
          out[c * 4 + 2] = a[2] * b0 + a[6] * b1 + a[10] * b2 + a[14] * b3;
          out[c * 4 + 3] = a[3] * b0 + a[7] * b1 + a[11] * b2 + a[15] * b3;
        }
        return out;
      }

      // =========================================================================
      // Shader Helpers
      // =========================================================================
      function compileShader(type, source) {
        const shader = gl.createShader(type);
        gl.shaderSource(shader, source);
        gl.compileShader(shader);
        if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
          const info = gl.getShaderInfoLog(shader);
          gl.deleteShader(shader);
          throw new Error(info);
        }
        return shader;
      }

      function createProgram(vsSource, fsSource) {
        const vs = compileShader(gl.VERTEX_SHADER, vsSource);
        const fs = compileShader(gl.FRAGMENT_SHADER, fsSource);
        const prog = gl.createProgram();
        gl.attachShader(prog, vs);
        gl.attachShader(prog, fs);
        gl.linkProgram(prog);
        if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
          throw new Error(gl.getProgramInfoLog(prog));
        }
        gl.deleteShader(vs);
        gl.deleteShader(fs);
        return prog;
      }

      // =========================================================================
      // Deterministic Procedural Terrain (JS side)
      // =========================================================================
      function fract(x) { return x - Math.floor(x); }
      function lerp(a, b, t) { return a + (b - a) * t; }
      function smoothstep(e0, e1, x) {
        const t = Math.max(0, Math.min(1, (x - e0) / (e1 - e0)));
        return t * t * (3 - 2 * t);
      }
      function hash2(x, y) { return fract(Math.sin(x * 127.1 + y * 311.7) * 43758.5453123); }
      function noise2(x, y) {
        const ix = Math.floor(x), iy = Math.floor(y);
        const fx = x - ix, fy = y - iy;
        const ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy);
        return lerp(lerp(hash2(ix, iy), hash2(ix + 1, iy), ux), lerp(hash2(ix, iy + 1), hash2(ix + 1, iy + 1), ux), uy);
      }

      function getStripInfo(theta) {
        // Continuous 360-degree cylinder terrain (sunlight enters from +Z dome, stars at -Z dome)
        return { c4: 1.0, windowMask: 0.0 };
      }

      function getRiverFactor(theta, z) {
        const sector = Math.round(theta / (Math.PI * 0.5)) * (Math.PI * 0.5);
        const dTheta = theta - sector;
        const riverCenter = 0.16 + 0.045 * Math.sin(z * 0.025) + 0.02 * Math.cos(z * 0.055);
        return 1.0 - smoothstep(0.022, 0.048, Math.abs(dTheta - riverCenter));
      }

      function getTerrainHeight(theta, z) {
        const { windowMask } = getStripInfo(theta);
        if (windowMask > 0.95) return -0.4;

        const sector = Math.round(theta / (Math.PI * 0.5)) * (Math.PI * 0.5);
        const dTheta = Math.abs(theta - sector);
        const lawnFlat = smoothstep(0.08, 0.22, dTheta);

        const n1 = noise2(theta * 4.5 + 3.1, z * 0.015);
        const n2 = noise2(theta * 10.0 + 7.4, z * 0.035);
        let h = (n1 * 5.2 + n2 * 1.8 - 1.5) * lawnFlat;
        h += 0.35 * Math.sin(z * 0.02) * Math.cos(theta * 8.0);

        const river = getRiverFactor(theta, z);
        h = lerp(h, -1.6, river);

        // Terraced rice paddies along one hillside slope
        const terraceZone = smoothstep(0.28, 0.42, Math.sin(z * 0.018 + sector * 2.0))
                          * smoothstep(0.14, 0.19, dTheta) * (1.0 - smoothstep(0.32, 0.36, dTheta))
                          * (1.0 - river);
        if (terraceZone > 0.01) {
          const stepSize = 0.85;
          const stepped = Math.floor(h / stepSize) * stepSize + smoothstep(0.72, 0.98, fract(h / stepSize)) * stepSize;
          h = lerp(h, stepped, terraceZone);
        }

        h = lerp(h, -0.4, windowMask);
        return h;
      }

      // Village cluster centers (shared between cottage placement & night ground-light pools)
      const VILLAGE_CLUSTERS = [
        { theta: -Math.PI * 0.5 - 0.14, z: -180 },
        { theta: -Math.PI * 0.5 + 0.11, z: -90 },
        { theta: -Math.PI * 0.5 - 0.13, z: 30 },
        { theta: -Math.PI * 0.5 + 0.11, z: 140 },
        { theta: 0.12, z: -60 },
        { theta: Math.PI * 0.5 - 0.12, z: 40 },
        { theta: Math.PI - 0.12, z: -110 }
      ];

      // =========================================================================
      // Common GLSL: Linear HDR Lighting, Atmospheric Scattering & PCF Shadows
      // =========================================================================
      const COMMON_GLSL = `
        uniform float uNight;
        uniform float uDusk;
        uniform mat4 uLightViewProj;
        uniform sampler2D uShadowMap;
        const vec3 SUN_DIR = normalize(vec3(0.24, 0.44, 0.86));

        vec3 getSkyFogColor() {
          vec3 dayFog = vec3(0.52, 0.75, 0.96);
          vec3 duskFog = vec3(0.92, 0.46, 0.34);
          vec3 nightFog = vec3(0.025, 0.045, 0.11);
          vec3 c = mix(dayFog, nightFog, uNight);
          return mix(c, duskFog, uDusk * 0.78);
        }

        vec3 getDirectLightColor() {
          vec3 daySun = vec3(1.42, 1.18, 0.86);
          vec3 duskSun = vec3(1.55, 0.64, 0.26);
          vec3 nightMoon = vec3(0.18, 0.26, 0.46);
          vec3 c = mix(daySun, nightMoon, uNight);
          return mix(c, duskSun, uDusk * 0.85);
        }

        vec3 getAmbientTint() {
          vec3 dayAmb = vec3(1.0, 1.0, 1.0);
          vec3 duskAmb = vec3(0.92, 0.64, 0.58);
          vec3 nightAmb = vec3(0.16, 0.22, 0.40);
          vec3 c = mix(dayAmb, nightAmb, uNight);
          return mix(c, duskAmb, uDusk * 0.72);
        }

        float calcShadowPCF(vec3 worldPos, vec3 N) {
          vec4 lp = uLightViewProj * vec4(worldPos, 1.0);
          vec3 proj = lp.xyz / lp.w * 0.5 + 0.5;
          if (proj.x < 0.01 || proj.x > 0.99 || proj.y < 0.01 || proj.y > 0.99 || proj.z > 0.999) {
            return 1.0;
          }
          float bias = max(0.0022 * (1.0 - max(dot(N, SUN_DIR), 0.0)), 0.00055);
          float texel = 1.0 / 2048.0;
          float shadow = 0.0;
          for (int x = -1; x <= 1; x++) {
            for (int y = -1; y <= 1; y++) {
              float pcfDepth = texture(uShadowMap, proj.xy + vec2(float(x), float(y)) * texel).r;
              shadow += (proj.z - bias > pcfDepth) ? 0.0 : 1.0;
            }
          }
          return shadow / 9.0;
        }

        // Outputs Linear HDR color (tone-mapped later in Bloom + ACES composite pass)
        vec3 applyAtmosphericHDR(vec3 color, float dist, vec3 worldPos) {
          vec3 rayDir = normalize(worldPos - uCamPos);
          float sunAlign = max(dot(rayDir, SUN_DIR), 0.0);
          vec3 baseFog = getSkyFogColor();
          vec3 sunTint = mix(vec3(1.15, 0.96, 0.76), vec3(1.25, 0.54, 0.28), uDusk);
          vec3 fogCol = mix(baseFog, sunTint, pow(sunAlign, 4.0) * 0.55 * (1.0 - uNight * 0.88));

          float f = 1.0 - exp(-pow(max(dist, 0.0) * 0.0020, 1.32));
          float endHaze = smoothstep(320.0, 415.0, abs(worldPos.z)) * 0.58;
          f = clamp(max(f, endHaze), 0.0, 1.0);

          vec3 hdr = mix(color, fogCol, f);
          hdr += vec3(0.30, 0.20, 0.10) * pow(sunAlign, 6.0) * (0.25 + 0.75 * f) * (1.0 - uNight * 0.90);
          return hdr;
        }
      `;

      // =========================================================================
      // Depth-Only Shadow Shaders
      // =========================================================================
      const shadowSimpleVS = `#version 300 es
        precision highp float;
        layout(location = 0) in vec3 aPos;
        layout(location = 3) in vec3 aInstPos;
        layout(location = 4) in vec3 aInstUp;
        layout(location = 5) in vec3 aInstMeta;
        uniform mat4 uLightViewProj;
        void main() {
          vec3 up = normalize(aInstUp);
          vec3 axial = vec3(0.0, 0.0, 1.0);
          vec3 right = normalize(cross(up, axial));
          axial = cross(right, up);
          float ca = cos(aInstMeta.x), sa = sin(aInstMeta.x);
          vec3 rx = right * ca + axial * sa;
          vec3 rz = -right * sa + axial * ca;
          vec3 local = aPos * aInstMeta.y;
          vec3 worldPos = aInstPos + rx * local.x + up * local.y + rz * local.z;
          gl_Position = uLightViewProj * vec4(worldPos, 1.0);
        }
      `;

      const shadowArchVS = `#version 300 es
        precision highp float;
        layout(location = 0) in vec3 aPos;
        layout(location = 2) in vec3 aInstData;
        uniform mat4 uLightViewProj;
        void main() {
          float theta = aInstData.x + aPos.x * aInstData.z;
          float r = 100.0 - aPos.y;
          vec3 worldPos = vec3(r * cos(theta), r * sin(theta), aInstData.y + aPos.z);
          gl_Position = uLightViewProj * vec4(worldPos, 1.0);
        }
      `;

      const shadowLeafVS = `#version 300 es
        precision highp float;
        layout(location = 0) in vec2 aQuad;
        layout(location = 1) in vec3 aInstPos;
        layout(location = 2) in vec4 aInstMeta;
        uniform mat4 uLightViewProj;
        out vec2 vUV;
        out float vType;
        void main() {
          vec3 right = normalize(vec3(0.88, -0.28, 0.0));
          vec3 up = normalize(cross(right, vec3(0.28, 0.88, 0.38)));
          vec3 worldPos = aInstPos + (right * aQuad.x + up * aQuad.y) * aInstMeta.x;
          vUV = aQuad * 0.5 + 0.5;
          vType = aInstMeta.z;
          gl_Position = uLightViewProj * vec4(worldPos, 1.0);
        }
      `;

      const shadowLeafFS = `#version 300 es
        precision highp float;
        in vec2 vUV;
        in float vType;
        uniform sampler2D uLeafAtlas;
        out vec4 fragColor;
        void main() {
          float sec = vType < 0.5 ? 0.0 : (vType > 2.5 ? 0.6666 : 0.3333);
          vec2 atlasUV = vec2(vUV.x * 0.3333 + sec, vUV.y);
          float a = texture(uLeafAtlas, atlasUV).a;
          if (a < 0.35) discard;
          fragColor = vec4(1.0);
        }
      `;

      const shadowEmptyFS = `#version 300 es
        precision highp float;
        out vec4 fragColor;
        void main() { fragColor = vec4(1.0); }
      `;

      // =========================================================================
      // 1. Cylinder Terrain Shader (Voronoi + FBM Patches, Rice Paddies, River, Night Village Glow)
      // =========================================================================
      const terrainVS = `#version 300 es
        precision highp float;
        layout(location = 0) in vec3 aPos;
        layout(location = 1) in vec3 aNormal;
        layout(location = 2) in vec3 aData;
        uniform mat4 uViewProj;
        out vec3 vWorldPos;
        out vec3 vNormal;
        out vec3 vData;
        void main() {
          vWorldPos = aPos; vNormal = aNormal; vData = aData;
          gl_Position = uViewProj * vec4(aPos, 1.0);
        }
      `;

      const terrainFS = `#version 300 es
        precision highp float;
        in vec3 vWorldPos;
        in vec3 vNormal;
        in vec3 vData;
        uniform vec3 uCamPos;
        uniform float uTime;
        out vec4 fragColor;
        ${COMMON_GLSL}

        float hash21(vec2 p) {
          p = fract(p * vec2(123.34, 456.21));
          p += dot(p, p + 45.32);
          return fract(p.x * p.y);
        }
        vec2 hash22(vec2 p) {
          return vec2(hash21(p), hash21(p + vec2(37.1, 19.7)));
        }
        float vnoise(vec2 p) {
          vec2 i = floor(p), f = fract(p);
          f = f * f * (3.0 - 2.0 * f);
          return mix(
            mix(hash21(i), hash21(i + vec2(1.0, 0.0)), f.x),
            mix(hash21(i + vec2(0.0, 1.0)), hash21(i + vec2(1.0, 1.0)), f.x),
            f.y
          );
        }
        float fbm(vec2 p) {
          float v = 0.0, a = 0.5;
          for (int i = 0; i < 3; i++) {
            v += a * vnoise(p);
            p = p * 2.03 + vec2(17.1, 31.7);
            a *= 0.5;
          }
          return v;
        }
        // Returns (cellID, edgeDist)
        vec2 voronoi2(vec2 x) {
          vec2 n = floor(x), f = fract(x);
          float md = 8.0, id = 0.0;
          for (int j = -1; j <= 1; j++) {
            for (int i = -1; i <= 1; i++) {
              vec2 g = vec2(float(i), float(j));
              vec2 o = hash22(n + g);
              vec2 r = g + o - f;
              float d = dot(r, r);
              if (d < md) { md = d; id = o.x; }
            }
          }
          return vec2(id, sqrt(md));
        }

        void main() {
          float theta = vData.x;
          float windowMask = vData.y;
          float riverMask = vData.z;

          vec3 N = normalize(vNormal);
          vec3 V = normalize(uCamPos - vWorldPos);
          float dist = length(uCamPos - vWorldPos);
          vec3 inward = normalize(vec3(-vWorldPos.x, -vWorldPos.y, 0.0));

          vec2 cylUV = vec2(theta * 100.0, vWorldPos.z);
          float fbmMacro = fbm(cylUV * 0.032);
          float fbmMid = fbm(cylUV * 0.16);
          float microFade = 1.0 - smoothstep(18.0, 110.0, dist);
          float microGrass = vnoise(cylUV * 2.6) * microFade;

          // Base lush meadow grass
          vec3 grassDark = vec3(0.11, 0.32, 0.10);
          vec3 grassMid  = vec3(0.22, 0.48, 0.15);
          vec3 grassSun  = vec3(0.38, 0.60, 0.19);
          vec3 landColor = mix(grassDark, grassMid, fbmMacro);
          landColor = mix(landColor, grassSun, smoothstep(0.45, 0.80, fbmMid) * 0.55);
          landColor *= (0.90 + 0.20 * microGrass);

          float sector = round(theta / 1.5707963) * 1.5707963;
          float dTheta = theta - sector;
          float absDTheta = abs(dTheta);
          float sideMask = smoothstep(0.14, 0.19, absDTheta) * (1.0 - smoothstep(0.32, 0.36, absDTheta));

          // Voronoi + FBM agricultural patches (Golden Wheat & Brown Plowed Farmland)
          vec2 vor = voronoi2(cylUV * 0.028 + vec2(fbmMacro * 0.6));
          float fieldPatch = sideMask * (1.0 - smoothstep(0.05, 0.25, riverMask));
          float terraceZone = smoothstep(0.28, 0.42, sin(vWorldPos.z * 0.018 + sector * 2.0)) * fieldPatch;

          if (fieldPatch > 0.05 && terraceZone < 0.5) {
            if (vor.x > 0.62) {
              // Golden wheat field with animated wind ripples
              float wRipple = vnoise(cylUV * 1.4 + vec2(uTime * 0.5, uTime * 0.35));
              vec3 wheatCol = mix(vec3(0.72, 0.54, 0.14), vec3(0.95, 0.78, 0.24), wRipple);
              landColor = mix(landColor, wheatCol, fieldPatch * 0.90);
            } else if (vor.x < 0.28) {
              // Brown plowed farmland with furrow stripes
              float furrow = 0.5 + 0.5 * sin(cylUV.y * 2.2 + fbmMid * 2.0);
              vec3 soilCol = mix(vec3(0.26, 0.17, 0.10), vec3(0.40, 0.28, 0.18), furrow);
              landColor = mix(landColor, soilCol, fieldPatch * 0.86);
            }
          }

          // Terraced Rice Paddies (contour water pads reflecting sun & sky)
          float flatPad = smoothstep(0.91, 0.985, dot(N, inward));
          if (terraceZone > 0.05) {
            float rWave = sin(cylUV.x * 1.5 + uTime * 1.2) * cos(cylUV.y * 1.3 - uTime * 0.9);
            vec3 paddyN = normalize(N + vec3(rWave * 0.022, 0.0, rWave * 0.022));
            vec3 H = normalize(SUN_DIR + V);
            float pSpec = pow(max(dot(paddyN, H), 0.0), 80.0);
            float pFres = pow(1.0 - max(dot(paddyN, V), 0.0), 3.0);
            vec3 skyRefl = mix(vec3(0.48, 0.74, 0.98), vec3(0.06, 0.09, 0.20), uNight);
            skyRefl = mix(skyRefl, vec3(0.92, 0.50, 0.34), uDusk * 0.75);
            vec3 paddyWater = mix(vec3(0.08, 0.22, 0.26), skyRefl, pFres * 0.85)
                            + getDirectLightColor() * pSpec * 1.45 * (1.0 - uNight * 0.7);
            landColor = mix(landColor, paddyWater, terraceZone * flatPad * 0.92);
          }

          // Dirt path
          float pathDist = abs(dTheta - (-0.06 + 0.015 * sin(vWorldPos.z * 0.02)));
          float pathMask = 1.0 - smoothstep(0.012, 0.024, pathDist);
          landColor = mix(landColor, vec3(0.58, 0.51, 0.39), pathMask * 0.78);

          // Sandy/earthy sloped riverbanks + dark teal reflective river water
          float bankMask = smoothstep(0.01, 0.25, riverMask) * (1.0 - smoothstep(0.25, 0.55, riverMask));
          landColor = mix(landColor, vec3(0.56, 0.46, 0.34) * (0.9 + 0.2 * fbmMid), bankMask * 0.92);

          if (riverMask > 0.15) {
            float w1 = sin(cylUV.y * 1.15 - uTime * 1.9 + cylUV.x * 0.35);
            float w2 = cos(cylUV.x * 2.1 + uTime * 1.5 - cylUV.y * 0.7);
            float w3 = vnoise(cylUV * 2.6 + vec2(0.0, -uTime * 1.6)) * 2.0 - 1.0;
            vec3 waterN = normalize(N + vec3((w1 * 0.45 + w3 * 0.55) * 0.065, 0.0, (w2 * 0.45 + w3 * 0.55) * 0.065));
            vec3 H = normalize(SUN_DIR + V);
            float spec = pow(max(dot(waterN, H), 0.0), 110.0);
            float fresnel = pow(1.0 - max(dot(waterN, V), 0.0), 3.0);
            vec3 skyRefl = mix(vec3(0.42, 0.68, 0.92), vec3(0.04, 0.07, 0.16), uNight);
            skyRefl = mix(skyRefl, vec3(0.94, 0.48, 0.32), uDusk * 0.78);
            vec3 waterBase = mix(vec3(0.03, 0.14, 0.20), skyRefl, fresnel * 0.78)
                           + getDirectLightColor() * spec * 2.25 * (1.0 - uNight * 0.65);
            landColor = mix(landColor, waterBase, smoothstep(0.15, 0.58, riverMask));
          }

          // PCF Shadow + Lighting
          float shadow = calcShadowPCF(vWorldPos, N);
          float sunDiff = max(dot(N, SUN_DIR), 0.0) * shadow;
          float axisDiff = max(dot(N, inward), 0.0);
          float hemi = 0.5 + 0.5 * dot(N, vec3(0.0, 1.0, 0.0));

          vec3 ambient = mix(vec3(0.24, 0.32, 0.30), vec3(0.50, 0.68, 0.88), hemi) * 0.50 * getAmbientTint();
          vec3 direct = getDirectLightColor() * (sunDiff * 0.78 + axisDiff * 0.22);
          vec3 litLand = landColor * (ambient + direct);

          // Night Village Warm Pool Lighting on ground around village clusters
          float nightGlowAmt = max(uNight, uDusk * 0.5);
          if (nightGlowAmt > 0.05) {
            float vGlow = 0.0;
            vGlow += exp(-dot(vec2((theta - (-1.7108)) * 100.0, vWorldPos.z + 180.0), vec2((theta - (-1.7108)) * 100.0, vWorldPos.z + 180.0)) * 0.0028);
            vGlow += exp(-dot(vec2((theta - (-1.4608)) * 100.0, vWorldPos.z +  90.0), vec2((theta - (-1.4608)) * 100.0, vWorldPos.z +  90.0)) * 0.0028);
            vGlow += exp(-dot(vec2((theta - (-1.7008)) * 100.0, vWorldPos.z -  30.0), vec2((theta - (-1.7008)) * 100.0, vWorldPos.z -  30.0)) * 0.0028);
            vGlow += exp(-dot(vec2((theta - (-1.4608)) * 100.0, vWorldPos.z - 140.0), vec2((theta - (-1.4608)) * 100.0, vWorldPos.z - 140.0)) * 0.0028);
            litLand += landColor * vec3(1.15, 0.78, 0.32) * vGlow * nightGlowAmt * 0.85;
          }

          // Sky / Window Strips
          if (windowMask > 0.01) {
            float skyGrad = 0.5 + 0.5 * sin(theta * 2.0 + 0.6);
            vec3 dayWin = mix(vec3(0.56, 0.80, 0.99), vec3(0.86, 0.95, 1.0), skyGrad);
            vec3 duskWin = mix(vec3(0.92, 0.48, 0.34), vec3(0.55, 0.36, 0.58), skyGrad);
            vec3 nightWin = vec3(0.02, 0.03, 0.08);
            float starH = hash21(floor(cylUV * 0.65));
            if (starH > 0.982) nightWin += vec3(0.9, 0.94, 1.0) * (starH - 0.982) * 55.0;
            vec3 winColor = mix(mix(dayWin, nightWin, uNight), duskWin, uDusk * 0.85);

            float gridZ = abs(fract(vWorldPos.z * 0.025) - 0.5);
            float gridT = abs(fract(theta * 12.0 / 3.14159) - 0.5);
            float frame = 1.0 - smoothstep(0.02, 0.05, min(gridZ, gridT));
            winColor = mix(winColor, vec3(0.22, 0.28, 0.36) * (1.0 - uNight * 0.5), frame * 0.45);
            litLand = mix(litLand, winColor, windowMask);
          }

          fragColor = vec4(applyAtmosphericHDR(litLand, dist, vWorldPos), 1.0);
        }
      `;

      // =========================================================================
      // 2. Aqueduct Colonnade Shader (Sandstone FBM + Mortar Brick Grid + Crevice AO + PCF Shadow)
      // =========================================================================
      const archVS = `#version 300 es
        precision highp float;
        layout(location = 0) in vec3 aPos;
        layout(location = 1) in vec3 aNormal;
        layout(location = 2) in vec3 aInstData;
        uniform mat4 uViewProj;
        out vec3 vWorldPos;
        out vec3 vNormal;
        out vec3 vLocalPos;
        out float vArchAO;
        void main() {
          float theta = aInstData.x + aPos.x * aInstData.z;
          float r = 100.0 - aPos.y;
          float cosT = cos(theta), sinT = sin(theta);
          vec3 worldPos = vec3(r * cosT, r * sinT, aInstData.y + aPos.z);
          vec3 tangent = vec3(-sinT, cosT, 0.0);
          vec3 inward  = vec3(-cosT, -sinT, 0.0);
          vec3 worldNormal = normalize(tangent * aNormal.x + inward * aNormal.y + vec3(0.0, 0.0, aNormal.z));
          vWorldPos = worldPos;
          vNormal = worldNormal;
          vLocalPos = vec3(theta * 100.0, aPos.y, aPos.z);
          // Corner & soffit AO baked from height & arch curvature
          float baseAO = smoothstep(-0.5, 2.2, aPos.y);
          float corniceAO = 1.0 - 0.28 * smoothstep(19.2, 20.6, aPos.y) * (1.0 - step(20.7, aPos.y));
          vArchAO = mix(0.62, 1.0, baseAO) * corniceAO;
          gl_Position = uViewProj * vec4(worldPos, 1.0);
        }
      `;

      const archFS = `#version 300 es
        precision highp float;
        in vec3 vWorldPos;
        in vec3 vNormal;
        in vec3 vLocalPos;
        in float vArchAO;
        uniform vec3 uCamPos;
        out vec4 fragColor;
        ${COMMON_GLSL}

        float hash21(vec2 p) {
          p = fract(p * vec2(127.1, 311.7));
          p += dot(p, p + 34.23);
          return fract(p.x * p.y);
        }
        float vnoise(vec2 p) {
          vec2 i = floor(p), f = fract(p);
          f = f * f * (3.0 - 2.0 * f);
          return mix(mix(hash21(i), hash21(i + vec2(1.0, 0.0)), f.x),
                     mix(hash21(i + vec2(0.0, 1.0)), hash21(i + vec2(1.0, 1.0)), f.x), f.y);
        }

        void main() {
          vec3 N = normalize(vNormal);
          float dist = length(uCamPos - vWorldPos);
          vec3 inward = normalize(vec3(-vWorldPos.x, -vWorldPos.y, 0.0));

          // Detailed Sandstone FBM + Staggered Ashlar Brick Mortar Grid
          vec2 stoneUV = vec2(vLocalPos.x + vLocalPos.z * 0.5, vLocalPos.y);
          float row = floor(stoneUV.y * 0.75);
          float blockY = abs(fract(stoneUV.y * 0.75) - 0.5);
          float blockX = abs(fract(stoneUV.x * 0.38 + mod(row, 2.0) * 0.5) - 0.5);
          float mortar = 1.0 - smoothstep(0.018, 0.045, min(blockX, blockY));

          float blockTint = hash21(vec2(floor(stoneUV.x * 0.38 + mod(row, 2.0) * 0.5), row));
          float grain = vnoise(stoneUV * 2.2) * 0.65 + vnoise(stoneUV * 7.5) * 0.35;

          vec3 sandstone = mix(vec3(0.84, 0.77, 0.64), vec3(0.95, 0.89, 0.76), grain * 0.7 + blockTint * 0.3);
          sandstone = mix(sandstone, vec3(0.52, 0.47, 0.40), mortar * 0.52);

          // Micro bump normal from mortar + sandstone grain
          vec3 bumpN = normalize(N + vec3((grain - 0.5) * 0.08, mortar * 0.06, (grain - 0.5) * 0.08));
          float shadow = calcShadowPCF(vWorldPos, bumpN);
          float sunDiff = max(dot(bumpN, SUN_DIR), 0.0) * shadow;
          float axisDiff = max(dot(bumpN, inward), 0.0);
          float hemi = 0.5 + 0.5 * dot(bumpN, vec3(0.0, 1.0, 0.0));

          vec3 ambient = mix(vec3(0.32, 0.36, 0.42), vec3(0.58, 0.70, 0.84), hemi) * 0.54 * vArchAO * getAmbientTint();
          vec3 direct = getDirectLightColor() * (sunDiff * 0.75 + axisDiff * 0.20);
          vec3 lit = sandstone * (ambient + direct);

          fragColor = vec4(applyAtmosphericHDR(lit, dist, vWorldPos), 1.0);
        }
      `;

      // =========================================================================
      // 3. Instanced Grass Shader (36k Blades + Simplex Wind + Gradient + PCF Shadow)
      // =========================================================================
      const grassVS = `#version 300 es
        precision highp float;
        layout(location = 0) in vec3 aPos;
        layout(location = 1) in vec2 aInstUV;
        layout(location = 2) in vec4 aInstSeed;
        uniform mat4 uViewProj;
        uniform vec3 uCamPos;
        uniform float uCamTheta;
        uniform float uCamZ;
        uniform float uTime;
        out vec3 vWorldPos;
        out vec3 vNormal;
        out float vHeight;
        out float vTint;
        out float vWind;

        const float PATCH_ARC = 0.72;
        const float PATCH_Z   = 76.0;

        vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
        vec2 mod289(vec2 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
        vec3 permute(vec3 x) { return mod289(((x * 34.0) + 1.0) * x); }
        float snoise(vec2 v) {
          const vec4 C = vec4(0.211324865405187, 0.366025403784439, -0.577350269189626, 0.024390243902439);
          vec2 i = floor(v + dot(v, C.yy));
          vec2 x0 = v - i + dot(i, C.xx);
          vec2 i1 = (x0.x > x0.y) ? vec2(1.0, 0.0) : vec2(0.0, 1.0);
          vec4 x12 = x0.xyxy + C.xxzz; x12.xy -= i1; i = mod289(i);
          vec3 p = permute(permute(i.y + vec3(0.0, i1.y, 1.0)) + i.x + vec3(0.0, i1.x, 1.0));
          vec3 m = max(0.5 - vec3(dot(x0, x0), dot(x12.xy, x12.xy), dot(x12.zw, x12.zw)), 0.0);
          m = m * m; m = m * m;
          vec3 x = 2.0 * fract(p * C.www) - 1.0;
          vec3 h = abs(x) - 0.5; vec3 ox = floor(x + 0.5); vec3 a0 = x - ox;
          m *= 1.79284291400159 - 0.85373472095314 * (a0 * a0 + h * h);
          vec3 g; g.x = a0.x * x0.x + h.x * x0.y; g.yz = a0.yz * x12.xz + h.yz * x12.yw;
          return 130.0 * dot(m, g);
        }

        float hash2(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123); }
        float vnoise2(vec2 p) {
          vec2 i = floor(p), f = fract(p), u = f * f * (3.0 - 2.0 * f);
          return mix(mix(hash2(i), hash2(i + vec2(1.0, 0.0)), u.x),
                     mix(hash2(i + vec2(0.0, 1.0)), hash2(i + vec2(1.0, 1.0)), u.x), u.y);
        }

        float getTerrainH(float theta, float z, out float windowMask, out float riverMask, out float pathMask) {
          windowMask = 0.0;
          float sector = round(theta / 1.5707963) * 1.5707963;
          float dTheta = theta - sector;
          float riverCenter = 0.16 + 0.045 * sin(z * 0.025) + 0.02 * cos(z * 0.055);
          riverMask = 1.0 - smoothstep(0.022, 0.048, abs(dTheta - riverCenter));
          pathMask = 1.0 - smoothstep(0.012, 0.024, abs(dTheta - (-0.06 + 0.015 * sin(z * 0.02))));
          float lawnFlat = smoothstep(0.08, 0.22, abs(dTheta));
          float n1 = vnoise2(vec2(theta * 4.5 + 3.1, z * 0.015));
          float n2 = vnoise2(vec2(theta * 10.0 + 7.4, z * 0.035));
          float h = (n1 * 5.2 + n2 * 1.8 - 1.5) * lawnFlat + 0.35 * sin(z * 0.02) * cos(theta * 8.0);
          h = mix(h, -1.6, riverMask);
          float tZone = smoothstep(0.28, 0.42, sin(z * 0.018 + sector * 2.0))
                      * smoothstep(0.14, 0.19, abs(dTheta)) * (1.0 - smoothstep(0.32, 0.36, abs(dTheta))) * (1.0 - riverMask);
          if (tZone > 0.01) {
            float st = floor(h / 0.85) * 0.85 + smoothstep(0.72, 0.98, fract(h / 0.85)) * 0.85;
            h = mix(h, st, tZone);
          }
          return mix(h, -0.4, windowMask);
        }

        void main() {
          float theta = uCamTheta + (fract(aInstUV.x - uCamTheta / PATCH_ARC + 0.5) - 0.5) * PATCH_ARC;
          float z     = uCamZ     + (fract(aInstUV.y - uCamZ     / PATCH_Z   + 0.5) - 0.5) * PATCH_Z;

          float windowMask, riverMask, pathMask;
          float h = getTerrainH(theta, z, windowMask, riverMask, pathMask);
          float r = 100.0 - h;
          float cosT = cos(theta), sinT = sin(theta);
          vec3 basePos = vec3(r * cosT, r * sinT, z);

          float dist = length(basePos - uCamPos);
          float radiusFade = 1.0 - smoothstep(26.0, 37.0, dist);
          float validMask = (1.0 - smoothstep(0.05, 0.25, windowMask))
                          * (1.0 - smoothstep(0.05, 0.25, riverMask))
                          * (1.0 - smoothstep(0.25, 0.55, pathMask)) * radiusFade;

          vec3 up = vec3(-cosT, -sinT, 0.0);
          vec3 tangent = vec3(-sinT, cosT, 0.0);
          vec3 axial = vec3(0.0, 0.0, 1.0);
          float ca = cos(aInstSeed.x), sa = sin(aInstSeed.x);
          vec3 bladeX = tangent * ca + axial * sa;
          vec3 bladeZ = -tangent * sa + axial * ca;

          float bladeH = aInstSeed.y * validMask;
          float bladeW = aInstSeed.z * validMask;

          float w1 = snoise(vec2(theta * 14.0 - uTime * 0.45, z * 0.14 - uTime * 0.65));
          float w2 = snoise(vec2(theta * 32.0 - uTime * 0.90, z * 0.32 - uTime * 1.15));
          float wind = w1 * 0.72 + w2 * 0.28;
          float bend = aPos.y * aPos.y;

          vec3 worldPos = basePos
                        + bladeX * (aPos.x * bladeW)
                        + up * (aPos.y * bladeH - abs(wind * 0.38 + 0.12) * 0.22 * bend * bladeH)
                        + bladeZ * (aPos.z * bladeH)
                        + (tangent * 0.55 + axial * 0.85) * (wind * 0.38 + 0.12) * bend * bladeH;

          vWorldPos = worldPos;
          vNormal = up;
          vHeight = aPos.y;
          vTint = aInstSeed.w;
          vWind = wind;
          gl_Position = uViewProj * vec4(worldPos, 1.0);
        }
      `;

      const grassFS = `#version 300 es
        precision highp float;
        in vec3 vWorldPos;
        in vec3 vNormal;
        in float vHeight;
        in float vTint;
        in float vWind;
        uniform vec3 uCamPos;
        out vec4 fragColor;
        ${COMMON_GLSL}
        void main() {
          float dist = length(uCamPos - vWorldPos);
          vec3 rootCol = vec3(0.08, 0.24, 0.07);
          vec3 midCol  = vec3(0.22, 0.50, 0.14);
          vec3 tipCol  = mix(vec3(0.45, 0.74, 0.22), vec3(0.62, 0.82, 0.26), vTint);
          vec3 col = mix(rootCol, midCol, smoothstep(0.0, 0.55, vHeight));
          col = mix(col, tipCol, smoothstep(0.45, 1.0, vHeight));
          if (vTint > 0.93 && vHeight > 0.72) {
            vec3 flowerCol = (vTint > 0.97) ? vec3(1.0, 0.96, 0.85) : (vTint > 0.95 ? vec3(0.95, 0.35, 0.35) : vec3(0.98, 0.82, 0.25));
            col = mix(col, flowerCol, smoothstep(0.72, 0.92, vHeight));
          }

          float shadow = calcShadowPCF(vWorldPos, vNormal);
          float litFactor = (0.42 + 0.58 * shadow) * (0.94 + 0.18 * max(vWind, 0.0) * vHeight);
          col *= litFactor * getAmbientTint() * mix(vec3(1.0), vec3(1.18, 0.82, 0.62), uDusk * 0.65);

          fragColor = vec4(applyAtmosphericHDR(col, dist, vWorldPos), 1.0);
        }
      `;

      // =========================================================================
      // 4. Instanced Leaf / Blossom Cluster Quads (Volumetric Tree Canopies + AO + Shadows)
      // =========================================================================
      const leafVS = `#version 300 es
        precision highp float;
        layout(location = 0) in vec2 aQuad;     // [-1, 1]
        layout(location = 1) in vec3 aInstPos;
        layout(location = 2) in vec4 aInstMeta; // x: size, y: crownAO, z: type (0:sakura, 1:poplar, 2:maple), w: seed

        uniform mat4 uViewProj;
        uniform vec3 uCamPos;
        uniform float uTime;

        out vec3 vWorldPos;
        out vec2 vUV;
        out vec4 vMeta;
        out vec3 vNormal;

        void main() {
          vec3 toCam = normalize(uCamPos - aInstPos);
          vec3 worldUp = normalize(vec3(-aInstPos.x, -aInstPos.y, 0.0));
          vec3 right = normalize(cross(worldUp, toCam));
          vec3 up = cross(toCam, right);

          // Rotate quad randomly around view axis (keep Weeping Willow tendrils hanging downward)
          float isWillow = step(2.5, aInstMeta.z);
          float sway = sin(uTime * 1.4 + aInstMeta.w * 18.0 + aInstPos.z * 0.2) * 0.14;
          float ang = mix(aInstMeta.w * 6.283185 + sway, sway * 0.65, isWillow);
          float ca = cos(ang), sa = sin(ang);
          vec2 rq = vec2(ca * aQuad.x - sa * aQuad.y, sa * aQuad.x + ca * aQuad.y);
          vec3 offset = (right * rq.x + up * rq.y * mix(1.0, 1.45, isWillow)) * aInstMeta.x;
          vec3 worldPos = aInstPos + offset;

          vWorldPos = worldPos;
          vUV = aQuad * 0.5 + 0.5;
          vMeta = aInstMeta;
          // Outward-facing normal approximation for crown lighting
          vNormal = normalize(mix(toCam, worldUp, 0.35) + right * rq.x * 0.4 + up * rq.y * 0.4);
          gl_Position = uViewProj * vec4(worldPos, 1.0);
        }
      `;

      const leafFS = `#version 300 es
        precision highp float;
        in vec3 vWorldPos;
        in vec2 vUV;
        in vec4 vMeta;
        in vec3 vNormal;
        uniform vec3 uCamPos;
        uniform sampler2D uLeafAtlas;
        out vec4 fragColor;
        ${COMMON_GLSL}

        void main() {
          float tType = vMeta.z;
          float sec = tType < 0.5 ? 0.0 : (tType > 2.5 ? 0.6666 : 0.3333);
          vec2 atlasUV = vec2(vUV.x * 0.3333 + sec, vUV.y);
          vec4 tex = texture(uLeafAtlas, atlasUV);
          if (tex.a < 0.30) discard;

          float dist = length(uCamPos - vWorldPos);
          vec3 N = normalize(vNormal);
          vec3 V = normalize(uCamPos - vWorldPos);
          float crownAO = vMeta.y;
          float seed = vMeta.w;

          vec3 baseCol;
          if (tType < 0.5) {
            baseCol = tex.rgb * mix(vec3(1.0, 0.88, 0.93), vec3(1.0, 0.98, 1.0), seed);
          } else if (tType < 1.5) {
            baseCol = tex.rgb * mix(vec3(0.45, 0.72, 0.38), vec3(0.75, 0.96, 0.52), seed);
          } else if (tType < 2.5) {
            float lum = dot(tex.rgb, vec3(0.3, 0.6, 0.1));
            baseCol = mix(vec3(0.82, 0.22, 0.06), vec3(1.0, 0.68, 0.16), clamp(lum * 1.4, 0.0, 1.0))
                    * mix(vec3(0.9, 0.8, 0.8), vec3(1.1, 1.0, 0.9), seed);
          } else {
            // Weeping Willow: luminous lime-green cascading tendrils
            baseCol = tex.rgb * mix(vec3(0.68, 0.96, 0.32), vec3(0.88, 1.08, 0.44), seed);
          }

          float shadow = calcShadowPCF(vWorldPos, N);
          float sunDiff = max(dot(N, SUN_DIR), 0.0) * shadow;
          float backLight = pow(max(dot(-V, SUN_DIR), 0.0), 3.0) * crownAO;

          vec3 ambient = vec3(0.44, 0.50, 0.56) * crownAO * getAmbientTint();
          vec3 direct = getDirectLightColor() * (sunDiff * 0.78 * crownAO + backLight * 0.32);
          vec3 lit = baseCol * (ambient + direct);

          fragColor = vec4(applyAtmosphericHDR(lit, dist, vWorldPos), 1.0);
        }
      `;

      // =========================================================================
      // 5. Vertex-Colored Instanced Props (Trunks, Obelisk, Cottages with Night Glow)
      // =========================================================================
      const vcolVS = `#version 300 es
        precision highp float;
        layout(location = 0) in vec3 aPos;
        layout(location = 1) in vec3 aNormal;
        layout(location = 2) in vec3 aVertColor;
        layout(location = 3) in vec3 aInstPos;
        layout(location = 4) in vec3 aInstUp;
        layout(location = 5) in vec3 aInstMeta;

        vec3 renderSpaceAndSaturn(vec3 rd) {

          float mw = exp(-pow((rd.y * 0.8 + rd.x * 0.55 + 0.08) * 3.8, 2.0));
          col += vec3(0.11, 0.15, 0.28) * mw;

      const petalFS = `#version 300 es

      // =========================================================================
      // Procedural Geometry Builders
      // =========================================================================
      function buildCylinderTerrain() {
        const radialSegs = 128, axialSegs = 160, cols = radialSegs + 1, rows = axialSegs + 1;
        const positions = new Float32Array(cols * rows * 3);
        const normals = new Float32Array(cols * rows * 3);
        const data = new Float32Array(cols * rows * 3);

        for (let iz = 0; iz <= axialSegs; iz++) {
          const z = -HALF_LENGTH + (iz / axialSegs) * LENGTH;
          for (let it = 0; it <= radialSegs; it++) {
            const theta = -Math.PI + (it / radialSegs) * (Math.PI * 2.0);
            const h = getTerrainHeight(theta, z), r = RADIUS - h;
            const idx = (iz * cols + it) * 3;
            positions[idx] = r * Math.cos(theta); positions[idx + 1] = r * Math.sin(theta); positions[idx + 2] = z;
            const { windowMask } = getStripInfo(theta);
            data[idx] = theta; data[idx + 1] = windowMask;
            data[idx + 2] = windowMask < 0.5 ? getRiverFactor(theta, z) : 0.0;
          }
        }

        const epsT = (Math.PI * 2.0) / radialSegs, epsZ = LENGTH / axialSegs;
        for (let iz = 0; iz <= axialSegs; iz++) {
          const z = -HALF_LENGTH + (iz / axialSegs) * LENGTH;
          for (let it = 0; it <= radialSegs; it++) {
            const theta = -Math.PI + (it / radialSegs) * (Math.PI * 2.0);
            const rL = RADIUS - getTerrainHeight(theta - epsT, z), rR = RADIUS - getTerrainHeight(theta + epsT, z);
            const rD = RADIUS - getTerrainHeight(theta, z - epsZ), rU = RADIUS - getTerrainHeight(theta, z + epsZ);
            const dTx = rR * Math.cos(theta + epsT) - rL * Math.cos(theta - epsT);
            const dTy = rR * Math.sin(theta + epsT) - rL * Math.sin(theta - epsT);
            const dZx = (rU - rD) * Math.cos(theta), dZy = (rU - rD) * Math.sin(theta), dZz = 2.0 * epsZ;
            let nx = -dZz * dTy, ny = dZz * dTx, nz = dZx * dTy - dZy * dTx;
            const len = Math.hypot(nx, ny, nz) || 1.0;
            const idx = (iz * cols + it) * 3;
            normals[idx] = nx / len; normals[idx + 1] = ny / len; normals[idx + 2] = nz / len;
          }
        }

        const indices = new Uint32Array(radialSegs * axialSegs * 6);
        let p = 0;
        for (let iz = 0; iz < axialSegs; iz++) {
          for (let it = 0; it < radialSegs; it++) {
            const a = iz * cols + it, b = a + 1, c = a + cols, d = c + 1;
            indices[p++] = a; indices[p++] = c; indices[p++] = b;
            indices[p++] = b; indices[p++] = c; indices[p++] = d;

        const vao = gl.createVertexArray();
        gl.bindVertexArray(vao);
        function bind(loc, arr) {

          gl.bufferData(gl.ARRAY_BUFFER, arr, gl.STATIC_DRAW);

        gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, indices, gl.STATIC_DRAW);
        gl.bindVertexArray(null);
        return { vao, count: indices.length };
      }

      function pushTriColor(pos, norm, col, a, b, c, color) {
        const ux = b[0] - a[0], uy = b[1] - a[1], uz = b[2] - a[2];
        const vx = c[0] - a[0], vy = c[1] - a[1], vz = c[2] - a[2];
        let nx = uy * vz - uz * vy, ny = uz * vx - ux * vz, nz = ux * vy - uy * vx;
        const len = Math.hypot(nx, ny, nz) || 1.0;
        nx /= len; ny /= len; nz /= len;
        pos.push(...a, ...b, ...c);
        norm.push(nx, ny, nz, nx, ny, nz, nx, ny, nz);
        col.push(...color, ...color, ...color);
      }

      function addBoxCol(pos, norm, col, x0, x1, y0, y1, z0, z1, color) {
        const v = [
          [x0, y0, z0], [x1, y0, z0], [x1, y1, z0], [x0, y1, z0],
          [x0, y0, z1], [x1, y0, z1], [x1, y1, z1], [x0, y1, z1]
        ];
        const faces = [[4,5,6,7], [1,0,3,2], [0,4,7,3], [5,1,2,6], [3,7,6,2], [0,1,5,4]];
        for (const f of faces) {
          pushTriColor(pos, norm, col, v[f[0]], v[f[1]], v[f[2]], color);
          pushTriColor(pos, norm, col, v[f[0]], v[f[2]], v[f[3]], color);

        const vao = gl.createVertexArray();
        gl.bindVertexArray(vao);
        function bindStatic(loc, data) {

        gl.bindTexture(gl.TEXTURE_2D, tex);
        if (hasFloatFBO) {
          gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA16F, w, h, 0, gl.RGBA, gl.HALF_FLOAT, null);
        } else {
          gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
        }
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
        return tex;
      }

      function rebuildPostFBOs(w, h) {
        if (sceneFBO) { gl.deleteFramebuffer(sceneFBO); gl.deleteTexture(sceneTex); gl.deleteRenderbuffer(sceneDepth); }
        sceneTex = createColorTex(w, h);
        sceneDepth = gl.createRenderbuffer();
        gl.bindRenderbuffer(gl.RENDERBUFFER, sceneDepth);
        gl.renderbufferStorage(gl.RENDERBUFFER, gl.DEPTH_COMPONENT24, w, h);
        sceneFBO = gl.createFramebuffer();
        gl.bindFramebuffer(gl.FRAMEBUFFER, sceneFBO);
        gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, sceneTex, 0);
        gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.DEPTH_ATTACHMENT, gl.RENDERBUFFER, sceneDepth);

        bloomW = Math.max(1, w >> 2);
        bloomH = Math.max(1, h >> 2);
        for (let i = 0; i < 2; i++) {
          if (bloomFBO[i]) { gl.deleteFramebuffer(bloomFBO[i]); gl.deleteTexture(bloomTex[i]); }
          bloomTex[i] = createColorTex(bloomW, bloomH);
          bloomFBO[i] = gl.createFramebuffer();
          gl.bindFramebuffer(gl.FRAMEBUFFER, bloomFBO[i]);
          gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, bloomTex[i], 0);
        }
        gl.bindFramebuffer(gl.FRAMEBUFFER, null);
      }

      function resize() {
        const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
        const w = Math.max(1, Math.floor(window.innerWidth * dpr));
        const h = Math.max(1, Math.floor(window.innerHeight * dpr));
        if (canvas.width !== w || canvas.height !== h) {
          canvas.width = w; canvas.height = h;
          rebuildPostFBOs(w, h);
        }
      }
      window.addEventListener('resize', resize);
      resize();

      const uniformCache = new WeakMap();
      function getULoc(prog, name) {
        let map = uniformCache.get(prog);
        if (!map) { map = Object.create(null); uniformCache.set(prog, map); }
        if (!(name in map)) map[name] = gl.getUniformLocation(prog, name);
        return map[name];
      }

      function bindCommonUniforms(prog, viewProj, nightVal, duskVal, lightViewProj) {
        gl.uniformMatrix4fv(getULoc(prog, 'uViewProj'), false, viewProj);
        gl.uniform3fv(getULoc(prog, 'uCamPos'), camPos);
        gl.uniform1f(getULoc(prog, 'uNight'), nightVal);
        gl.uniform1f(getULoc(prog, 'uDusk'), duskVal);
        gl.uniformMatrix4fv(getULoc(prog, 'uLightViewProj'), false, lightViewProj);
        gl.uniform1i(getULoc(prog, 'uShadowMap'), 0);
      }

      // =========================================================================
      // Camera, Time Mode & 90s Cinematic Spline
      // =========================================================================
      let mode = 'cinematic', timeMode = 'auto';
      const camPos = [0.0, -(RADIUS - 2.5), -240.0];
      let yaw = Math.PI * 0.5, pitch = 0.08;
      const keys = Object.create(null);
      let isDragging = false, lastMouseX = 0, lastMouseY = 0;

      window.addEventListener('keydown', (e) => {
        const k = e.key.toLowerCase();
        keys[k] = true;
        if (k === 'c') {
          mode = mode === 'cinematic' ? 'free' : 'cinematic';
          modeBadgeEl.textContent = mode === 'free' ? 'FREE EXPLORE' : 'CINEMATIC AUTO-DRIVE';
          modeBadgeEl.classList.toggle('free', mode === 'free');
          freeControlsEl.style.display = mode === 'free' ? 'block' : 'none';
          if (mode === 'free') fadeOverlayEl.style.opacity = '0';
        } else if (k === '1') { timeMode = 'day'; timeBadgeEl.textContent = 'DAY'; }
        else if (k === '2')   { timeMode = 'night'; timeBadgeEl.textContent = 'NIGHT'; }
        else if (k === '3')   { timeMode = 'auto'; timeBadgeEl.textContent = 'AUTO CYCLE'; }
        else if (k === 'h')   { hudEl.classList.toggle('hidden'); }
        else if (k === 'r')   { toggleVideoRecord(); }
      });

      let cinTimeOffset = 0.0;
      let mediaRecorder = null, recTimer = null;

      function toggleVideoRecord() {
        if (mediaRecorder && mediaRecorder.state === 'recording') {
          clearTimeout(recTimer);
          mediaRecorder.stop();
          return;
        }
        if (typeof canvas.captureStream !== 'function' || typeof MediaRecorder === 'undefined') {
          alert('이 브라우저는 캔버스 직접 녹화를 지원하지 않습니다. Win+G 또는 OBS를 사용해 주세요.');
          return;
        }
        mode = 'cinematic';
        timeMode = 'auto';
        modeBadgeEl.textContent = 'CINEMATIC AUTO-DRIVE';
        modeBadgeEl.classList.remove('free');
        freeControlsEl.style.display = 'none';
        timeBadgeEl.textContent = 'AUTO CYCLE';
        cinTimeOffset = performance.now() * 0.001;
        hudEl.classList.add('hidden');

        const stream = canvas.captureStream(60);
        const mime = MediaRecorder.isTypeSupported('video/webm;codecs=vp9') ? 'video/webm;codecs=vp9' : 'video/webm';
        const chunks = [];
        mediaRecorder = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 12000000 });
        mediaRecorder.ondataavailable = (e) => { if (e.data && e.data.size > 0) chunks.push(e.data); };
        mediaRecorder.onstop = () => {
          hudEl.classList.remove('hidden');
          const blob = new Blob(chunks, { type: 'video/webm' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = 'oneill-cylinder-cinematic.webm';
          a.click();
          setTimeout(() => URL.revokeObjectURL(url), 5000);
        };
        mediaRecorder.start(250);
        recTimer = setTimeout(() => {
          if (mediaRecorder && mediaRecorder.state === 'recording') mediaRecorder.stop();
        }, LOOP_DURATION * 1000);
      }
      window.addEventListener('keyup', (e) => { keys[e.key.toLowerCase()] = false; });
      canvas.addEventListener('mousedown', (e) => { if (mode === 'free') { isDragging = true; lastMouseX = e.clientX; lastMouseY = e.clientY; } });
      window.addEventListener('mouseup', () => { isDragging = false; });
      window.addEventListener('mousemove', (e) => {
        if (!isDragging || mode !== 'free') return;
        yaw += (e.clientX - lastMouseX) * 0.004;
        pitch = Math.max(-1.45, Math.min(1.45, pitch - (e.clientY - lastMouseY) * 0.004));
        lastMouseX = e.clientX; lastMouseY = e.clientY;
      });

      const LOOP_DURATION = 90.0;
      const cinTarget = [0, -90, 0];
      const SPLINE_WAYPOINTS = [
        { p: [  0.0,  38.0, -220.0], l: [  0.0, -25.0,   60.0] },
        { p: [-14.0,  10.0, -140.0], l: [  0.0, -50.0,   80.0] },
        { p: [ -6.0, -86.0,  -70.0], l: [  0.0, -90.0,   60.0] },
        { p: [ -3.0, -95.2,   15.0], l: [  2.0, -91.0,   90.0] },
        { p: [  0.0, -94.8,   95.0], l: [  0.0, -84.0,  210.0] },
        { p: [  0.0, -94.5,  185.0], l: [  0.0, -76.0,  275.0] },
        { p: [  2.0, -78.0,  230.0], l: [  0.0, -64.0,  275.0] },
        { p: [ 12.0, -10.0,  140.0], l: [  0.0,  15.0,   40.0] },
        { p: [ 22.0,  22.0,   40.0], l: [  0.0,  25.0,  -40.0] },
        { p: [ 15.5, -94.2,   60.0], l: [ 15.5, -96.0,  -30.0] },
        { p: [ 15.8, -95.4,  -40.0], l: [ 14.5, -95.0, -130.0] },
        { p: [-13.0, -94.2, -145.0], l: [-13.5, -95.5, -210.0] },
        { p: [ -4.0, -72.0, -250.0], l: [ 12.0,  35.0, -400.0] },
        { p: [  0.0, -45.0, -325.0], l: [ 14.0,  68.0, -400.0] }
      ];

      function catmullRomVec3(p0, p1, p2, p3, s) {
        const s2 = s * s, s3 = s2 * s, out = [0, 0, 0];
        for (let i = 0; i < 3; i++) {
          out[i] = 0.5 * ((2*p1[i]) + (-p0[i]+p2[i])*s + (2*p0[i]-5*p1[i]+4*p2[i]-p3[i])*s2 + (-p0[i]+3*p1[i]-3*p2[i]+p3[i])*s3);
        }
        return out;
      }

      function updateCinematicCamera(t) {
        const u = (t % LOOP_DURATION) / LOOP_DURATION, n = SPLINE_WAYPOINTS.length - 1;
        const scaled = u * n, idx = Math.min(n - 1, Math.floor(scaled)), s = scaled - idx;
        const pos = catmullRomVec3(SPLINE_WAYPOINTS[Math.max(0,idx-1)].p, SPLINE_WAYPOINTS[idx].p, SPLINE_WAYPOINTS[Math.min(n,idx+1)].p, SPLINE_WAYPOINTS[Math.min(n,idx+2)].p, s);
        const look = catmullRomVec3(SPLINE_WAYPOINTS[Math.max(0,idx-1)].l, SPLINE_WAYPOINTS[idx].l, SPLINE_WAYPOINTS[Math.min(n,idx+1)].l, SPLINE_WAYPOINTS[Math.min(n,idx+2)].l, s);

        const trackBlend = smoothstep(0.48, 0.53, u) * (1.0 - smoothstep(0.62, 0.67, u));
        if (trackBlend > 0.001) {
          const st = storkFlock.getLeaderState(t);
          for (let i = 0; i < 3; i++) {
            pos[i] = lerp(pos[i], st.pos[i] - st.fwd[i]*5.2 + st.up[i]*1.4, trackBlend);
            look[i] = lerp(look[i], st.pos[i] + st.fwd[i]*12.0, trackBlend);
          }
        }
        const r = Math.hypot(pos[0], pos[1]);
        if (r > RADIUS - 2.2) { pos[0] = (pos[0]/r)*(RADIUS-2.2); pos[1] = (pos[1]/r)*(RADIUS-2.2); }
        camPos[0] = pos[0]; camPos[1] = pos[1]; camPos[2] = pos[2];
        cinTarget[0] = look[0]; cinTarget[1] = look[1]; cinTarget[2] = look[2];
        fadeOverlayEl.style.opacity = Math.max(smoothstep(0.96, 0.998, u), 1.0 - smoothstep(0.0, 0.025, u)).toFixed(3);
      }

      function updateFreeCamera(dt) {
        const moveSpeed = (keys['shift'] ? 28.0 : 45.0) * dt, cosP = Math.cos(pitch);
        const fx = Math.cos(yaw) * cosP, fy = Math.sin(pitch), fz = Math.sin(yaw) * cosP;
        const rx = -Math.sin(yaw), rz = Math.cos(yaw);
        let mx = 0, my = 0, mz = 0;
        if (keys['w'] || keys['arrowup'])    { mx += fx; my += fy; mz += fz; }
        if (keys['s'] || keys['arrowdown'])  { mx -= fx; my -= fy; mz -= fz; }
        if (keys['d'] || keys['arrowright']) { mx += rx; mz += rz; }
        if (keys['a'] || keys['arrowleft'])  { mx -= rx; mz -= rz; }
        if (keys[' ']) my += 1.0; if (keys['control'] || keys['q']) my -= 1.0;
        const mLen = Math.hypot(mx, my, mz);
        if (mLen > 0.0001) { camPos[0] += (mx/mLen)*moveSpeed; camPos[1] += (my/mLen)*moveSpeed; camPos[2] += (mz/mLen)*moveSpeed; }
        const r = Math.hypot(camPos[0], camPos[1]);
        if (r > RADIUS - 2.2) { camPos[0] = (camPos[0]/r)*(RADIUS-2.2); camPos[1] = (camPos[1]/r)*(RADIUS-2.2); }
        camPos[2] = Math.max(-HALF_LENGTH + 8.0, Math.min(HALF_LENGTH - 8.0, camPos[2]));
      }

      // =========================================================================
      // Render Loop: Shadow Pass -> HDR Scene FBO -> Bloom Blur -> ACES Composite
      // =========================================================================
      const projMat = new Float32Array(16), viewMat = new Float32Array(16), viewProjMat = new Float32Array(16);
      const lightProj = new Float32Array(16), lightView = new Float32Array(16), lightViewProj = new Float32Array(16);
      const sunDirLen = Math.hypot(0.24, 0.44, 0.86);
      const sunDirN = [0.24 / sunDirLen, 0.44 / sunDirLen, 0.86 / sunDirLen];

      let lastTime = performance.now(), fpsFrames = 0, fpsLast = lastTime;

      function frame(now) {
        const dt = Math.min((now - lastTime) * 0.001, 0.1);
        lastTime = now;
        const t = now * 0.001;

        fpsFrames++;
        if (now - fpsLast >= 500) {
          fpsEl.textContent = `FPS: ${Math.round((fpsFrames * 1000) / (now - fpsLast))}`;
          fpsFrames = 0; fpsLast = now;
        }

        const cinT = Math.max(0.0, t - cinTimeOffset);
        let nightVal = 0.0, duskVal = 0.0;
        if (timeMode === 'night') { nightVal = 1.0; }
        else if (timeMode === 'auto') {
          const u = (cinT % LOOP_DURATION) / LOOP_DURATION;
          nightVal = smoothstep(0.56, 0.80, u);
          duskVal = smoothstep(0.45, 0.60, u) * (1.0 - smoothstep(0.68, 0.82, u));
        }

        if (mode === 'cinematic') updateCinematicCamera(cinT);
        else updateFreeCamera(dt);

        storkFlock.update(t);

        // --- PASS 1: 2048x2048 Directional Shadow Map ---
        const lCenter = [camPos[0] * 0.4, camPos[1] * 0.4, camPos[2]];
        const lEye = [lCenter[0] + sunDirN[0] * 140, lCenter[1] + sunDirN[1] * 140, lCenter[2] + sunDirN[2] * 140];
        mat4Ortho(lightProj, -115, 115, -115, 115, 10, 320);
        mat4LookAt(lightView, lEye, lCenter, [0, 0, 1]);
        mat4Mul(lightViewProj, lightProj, lightView);

        gl.bindFramebuffer(gl.FRAMEBUFFER, shadowFBO);
        gl.viewport(0, 0, SHADOW_RES, SHADOW_RES);
        gl.enable(gl.DEPTH_TEST);
        gl.enable(gl.CULL_FACE);
        gl.cullFace(gl.BACK);
        gl.clear(gl.DEPTH_BUFFER_BIT);

        gl.useProgram(shadowArchProg);
        gl.uniformMatrix4fv(gl.getUniformLocation(shadowArchProg, 'uLightViewProj'), false, lightViewProj);
        gl.bindVertexArray(colonnade.vao);
        gl.drawElementsInstanced(gl.TRIANGLES, colonnade.indexCount, gl.UNSIGNED_SHORT, 0, colonnade.instanceCount);

        gl.useProgram(shadowSimpleProg);
        gl.uniformMatrix4fv(gl.getUniformLocation(shadowSimpleProg, 'uLightViewProj'), false, lightViewProj);
        gl.bindVertexArray(trees.trunks.vao);
        gl.drawArraysInstanced(gl.TRIANGLES, 0, trees.trunks.vertexCount, trees.trunks.instanceCount);
        gl.bindVertexArray(obelisk.vao);
        gl.drawArraysInstanced(gl.TRIANGLES, 0, obelisk.vertexCount, obelisk.instanceCount);
        gl.bindVertexArray(cottages.vao);
        gl.drawArraysInstanced(gl.TRIANGLES, 0, cottages.vertexCount, cottages.instanceCount);

        gl.disable(gl.CULL_FACE);
        gl.useProgram(shadowLeafProg);
        gl.uniformMatrix4fv(gl.getUniformLocation(shadowLeafProg, 'uLightViewProj'), false, lightViewProj);
        gl.activeTexture(gl.TEXTURE1);
        gl.bindTexture(gl.TEXTURE_2D, leafAtlasTex);
        gl.uniform1i(gl.getUniformLocation(shadowLeafProg, 'uLeafAtlas'), 1);
        gl.bindVertexArray(trees.leaves.vao);
        gl.drawElementsInstanced(gl.TRIANGLES, trees.leaves.indexCount, gl.UNSIGNED_SHORT, 0, trees.leaves.instanceCount);
        gl.enable(gl.CULL_FACE);

        // --- PASS 2: Main 3D Scene into Offscreen HDR FBO ---
        gl.bindFramebuffer(gl.FRAMEBUFFER, sceneFBO);
        gl.viewport(0, 0, canvas.width, canvas.height);

        const aspect = canvas.width / Math.max(1, canvas.height);
        mat4Perspective(projMat, (68 * Math.PI) / 180, aspect, 0.3, 1200.0);
        const target = mode === 'cinematic' ? cinTarget : [
          camPos[0] + Math.cos(yaw) * Math.cos(pitch),
          camPos[1] + Math.sin(pitch),
          camPos[2] + Math.sin(yaw) * Math.cos(pitch)
        ];
        mat4LookAt(viewMat, camPos, target, [0, 1, 0]);
        mat4Mul(viewProjMat, projMat, viewMat);

        const bgR = lerp(lerp(0.46, 0.025, nightVal), 0.92, duskVal * 0.78);
        const bgG = lerp(lerp(0.72, 0.045, nightVal), 0.46, duskVal * 0.78);
        const bgB = lerp(lerp(0.98, 0.110, nightVal), 0.34, duskVal * 0.78);
        gl.clearColor(bgR, bgG, bgB, 1.0);
        gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

        gl.activeTexture(gl.TEXTURE0);
        gl.bindTexture(gl.TEXTURE_2D, shadowTex);

        // Terrain
        gl.useProgram(terrainProg);
        bindCommonUniforms(terrainProg, viewProjMat, nightVal, duskVal, lightViewProj);
        gl.uniform1f(gl.getUniformLocation(terrainProg, 'uTime'), t);
        gl.bindVertexArray(terrainMesh.vao);
        gl.drawElements(gl.TRIANGLES, terrainMesh.count, gl.UNSIGNED_INT, 0);

        // Endcaps (+Z Solar Dome & -Z Saturn Space Dome)
        gl.disable(gl.CULL_FACE);
        gl.useProgram(endcapProg);
        bindCommonUniforms(endcapProg, viewProjMat, nightVal, duskVal, lightViewProj);
        gl.bindVertexArray(endcaps.vao);
        gl.drawArrays(gl.TRIANGLES, 0, endcaps.vertexCount);
        gl.enable(gl.CULL_FACE);

        // Aqueduct Colonnade
        gl.useProgram(archProg);
        bindCommonUniforms(archProg, viewProjMat, nightVal, duskVal, lightViewProj);
        gl.bindVertexArray(colonnade.vao);
        gl.drawElementsInstanced(gl.TRIANGLES, colonnade.indexCount, gl.UNSIGNED_SHORT, 0, colonnade.instanceCount);

        // Grass
        gl.disable(gl.CULL_FACE);
        gl.useProgram(grassProg);
        bindCommonUniforms(grassProg, viewProjMat, nightVal, duskVal, lightViewProj);
        gl.uniform1f(gl.getUniformLocation(grassProg, 'uCamTheta'), Math.atan2(camPos[1], camPos[0]));
        gl.uniform1f(gl.getUniformLocation(grassProg, 'uCamZ'), camPos[2]);
        gl.uniform1f(gl.getUniformLocation(grassProg, 'uTime'), t);
        gl.bindVertexArray(grassField.vao);
        gl.drawElementsInstanced(gl.TRIANGLES, grassField.indexCount, gl.UNSIGNED_SHORT, 0, grassField.instanceCount);

        // Tree Trunks, Obelisk, Cottages
        gl.enable(gl.CULL_FACE);
        gl.useProgram(vcolProg);
        bindCommonUniforms(vcolProg, viewProjMat, nightVal, duskVal, lightViewProj);
        gl.bindVertexArray(trees.trunks.vao);
        gl.drawArraysInstanced(gl.TRIANGLES, 0, trees.trunks.vertexCount, trees.trunks.instanceCount);
        gl.bindVertexArray(obelisk.vao);
        gl.drawArraysInstanced(gl.TRIANGLES, 0, obelisk.vertexCount, obelisk.instanceCount);
        gl.bindVertexArray(cottages.vao);
        gl.drawArraysInstanced(gl.TRIANGLES, 0, cottages.vertexCount, cottages.instanceCount);

        // Volumetric Leaf/Blossom Quads + Storks
        gl.disable(gl.CULL_FACE);
        gl.useProgram(leafProg);
        bindCommonUniforms(leafProg, viewProjMat, nightVal, duskVal, lightViewProj);
        gl.uniform1f(gl.getUniformLocation(leafProg, 'uTime'), t);
        gl.activeTexture(gl.TEXTURE1);
        gl.bindTexture(gl.TEXTURE_2D, leafAtlasTex);
        gl.uniform1i(gl.getUniformLocation(leafProg, 'uLeafAtlas'), 1);
        gl.bindVertexArray(trees.leaves.vao);
        gl.drawElementsInstanced(gl.TRIANGLES, trees.leaves.indexCount, gl.UNSIGNED_SHORT, 0, trees.leaves.instanceCount);

        gl.useProgram(storkProg);
        bindCommonUniforms(storkProg, viewProjMat, nightVal, duskVal, lightViewProj);
        gl.uniform1f(gl.getUniformLocation(storkProg, 'uTime'), t);
        gl.bindVertexArray(storkFlock.vao);
        gl.drawArraysInstanced(gl.TRIANGLES, 0, storkFlock.vertexCount, storkFlock.instanceCount);
        gl.enable(gl.CULL_FACE);

        // Soft Fluffy Billboarded Clouds (alpha-blended, zero polygon edges)
        gl.enable(gl.BLEND);
        gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
        gl.depthMask(false);
        gl.disable(gl.CULL_FACE);
        gl.useProgram(cloudProg);
        bindCommonUniforms(cloudProg, viewProjMat, nightVal, duskVal, lightViewProj);
        gl.uniform1f(gl.getUniformLocation(cloudProg, 'uTime'), t);
        gl.activeTexture(gl.TEXTURE1);
        gl.bindTexture(gl.TEXTURE_2D, cloudPuffTex);
        gl.uniform1i(gl.getUniformLocation(cloudProg, 'uCloudTex'), 1);
        gl.bindVertexArray(clouds.vao);
        gl.drawElementsInstanced(gl.TRIANGLES, clouds.indexCount, gl.UNSIGNED_SHORT, 0, clouds.instanceCount);
        gl.enable(gl.CULL_FACE);

        // Petals & Night Fireflies
        gl.useProgram(petalProg);
        gl.uniformMatrix4fv(gl.getUniformLocation(petalProg, 'uViewProj'), false, viewProjMat);
        gl.uniform3fv(gl.getUniformLocation(petalProg, 'uCamPos'), camPos);
        gl.uniform1f(gl.getUniformLocation(petalProg, 'uTime'), t);
        gl.uniform1f(gl.getUniformLocation(petalProg, 'uNight'), nightVal);
        gl.bindVertexArray(petals.vao);
        gl.drawArrays(gl.POINTS, 0, petals.count);
        gl.depthMask(true);
        gl.disable(gl.BLEND);

        // --- PASS 3: Bright-Pass & Separable Gaussian Bloom (Quarter-Res) ---
        gl.disable(gl.DEPTH_TEST);
        gl.bindVertexArray(emptyVAO);

        gl.bindFramebuffer(gl.FRAMEBUFFER, bloomFBO[0]);
        gl.viewport(0, 0, bloomW, bloomH);
        gl.useProgram(bloomExtractProg);
        gl.activeTexture(gl.TEXTURE0);
        gl.bindTexture(gl.TEXTURE_2D, sceneTex);
        gl.uniform1i(gl.getUniformLocation(bloomExtractProg, 'uSceneTex'), 0);
        gl.drawArrays(gl.TRIANGLES, 0, 3);

        gl.useProgram(blurProg);
        gl.uniform1i(gl.getUniformLocation(blurProg, 'uTex'), 0);
        for (let iter = 0; iter < 2; iter++) {
          gl.bindFramebuffer(gl.FRAMEBUFFER, bloomFBO[1]);
          gl.bindTexture(gl.TEXTURE_2D, bloomTex[0]);
          gl.uniform2f(gl.getUniformLocation(blurProg, 'uDir'), 1.0 / bloomW, 0.0);
          gl.drawArrays(gl.TRIANGLES, 0, 3);

          gl.bindFramebuffer(gl.FRAMEBUFFER, bloomFBO[0]);
          gl.bindTexture(gl.TEXTURE_2D, bloomTex[1]);
          gl.uniform2f(gl.getUniformLocation(blurProg, 'uDir'), 0.0, 1.0 / bloomH);
          gl.drawArrays(gl.TRIANGLES, 0, 3);
        }

        // --- PASS 4: Final ACES Filmic Composite to Screen ---
        gl.bindFramebuffer(gl.FRAMEBUFFER, null);
        gl.viewport(0, 0, canvas.width, canvas.height);
        gl.useProgram(compositeProg);
        gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, sceneTex);
        gl.uniform1i(gl.getUniformLocation(compositeProg, 'uSceneTex'), 0);
        gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, bloomTex[0]);
        gl.uniform1i(gl.getUniformLocation(compositeProg, 'uBloomTex'), 1);

        const sunWorld = [camPos[0] + sunDirN[0]*500, camPos[1] + sunDirN[1]*500, camPos[2] + sunDirN[2]*500];
        const sx = viewProjMat[0]*sunWorld[0] + viewProjMat[4]*sunWorld[1] + viewProjMat[8]*sunWorld[2] + viewProjMat[12];
        const sy = viewProjMat[1]*sunWorld[0] + viewProjMat[5]*sunWorld[1] + viewProjMat[9]*sunWorld[2] + viewProjMat[13];
        const sw = viewProjMat[3]*sunWorld[0] + viewProjMat[7]*sunWorld[1] + viewProjMat[11]*sunWorld[2] + viewProjMat[15];
        const sunVis = sw > 0.1 ? Math.max(0.0, Math.min(1.0, (sw - 0.1) * 0.5)) : 0.0;
        gl.uniform2f(gl.getUniformLocation(compositeProg, 'uSunScreen'), (sx/sw)*0.5+0.5, (sy/sw)*0.5+0.5);
        gl.uniform1f(gl.getUniformLocation(compositeProg, 'uSunIntensity'), sunVis * 0.85 * (1.0 - nightVal * 0.92));
        gl.uniform1f(gl.getUniformLocation(compositeProg, 'uAspect'), aspect);
        gl.drawArrays(gl.TRIANGLES, 0, 3);

        gl.enable(gl.DEPTH_TEST);
        gl.bindVertexArray(null);
        requestAnimationFrame(frame);
      }

      requestAnimationFrame(frame);
    })();
  </script>
